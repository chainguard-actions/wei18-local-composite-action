name: Test repository not found fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create unrelated layout
        run: |
          rm -rf /tmp/lca-nf
          mkdir -p /tmp/lca-nf/_actions/SomeOrg/SomeRepo/v1/action
      - id: action
        uses: .
        continue-on-error: true
        with:
          action_path: /tmp/lca-nf/_actions/SomeOrg/SomeRepo/v1/action
          action_repository: LcaMissingOrg/LcaMissingRepo
      - name: Assert failure and no symlink
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          ROOT_DIR="$(dirname "$GITHUB_WORKSPACE")"
          if [ -L "$ROOT_DIR/LcaMissingOrg/LcaMissingRepo" ]; then
            echo "FAIL: symlink should not exist"
            exit 1
          fi
          echo "PASS"
