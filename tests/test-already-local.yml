name: Test skip when action path is already local
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action_path: /home/runner/work/x/x/./../LcaLocalOrg/LcaLocalRepo/action
          action_repository: LcaLocalOrg/LcaLocalRepo
      - name: Assert step succeeded and no symlink created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          ROOT_DIR="$(dirname "$GITHUB_WORKSPACE")"
          if [ -e "$ROOT_DIR/LcaLocalOrg/LcaLocalRepo" ] || [ -L "$ROOT_DIR/LcaLocalOrg/LcaLocalRepo" ]; then
            echo "FAIL: symlink should not have been created"
            exit 1
          fi
          echo "PASS"
