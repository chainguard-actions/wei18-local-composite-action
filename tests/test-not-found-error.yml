name: Test error when action repository not found in path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action_path: "/tmp/some/unrelated/path"
          action_repository: "myorg/myrepo"
        continue-on-error: true

      - name: Assert action failed when repo not found in path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when org/repo not found in action_path"
            exit 1
          fi
          echo "PASS: action correctly failed when repository not found in path"
