name: Test already-symlinked path - skip remaining steps
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action_repository: wei18/local-composite-action
          # action_path contains './../' which signals it's already a local symlinked path
          action_path: /some/path/./../wei18/local-composite-action/action

      - name: Assert action completed without error (symlink detection skipped remaining steps)
        run: |
          echo "PASS: action completed successfully when action_path contains ./../"
          echo "The action detected the existing symlink and skipped find/create steps."
