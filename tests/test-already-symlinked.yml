name: Test already-symlinked action path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action_path: "/home/runner/work/_actions/wei18/./../local-composite-action/1.1.0"
          action_repository: "wei18/local-composite-action"

      - name: Assert exist output is true
        env:
          ACTUAL: ${{ steps.action.outputs.exist }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected exist=true when action_path contains ./../"
            exit 1
          fi
          echo "PASS"
