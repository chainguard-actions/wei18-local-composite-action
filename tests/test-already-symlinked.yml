name: Test already-symlinked detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action_repository: some-org/some-repo
          action_path: /some/path/./../some-org/some-repo/abc123/path/to/action

      - name: Assert exist output is true
        env:
          ACTUAL: ${{ steps.action.outputs.exist }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected exist=true when action_path contains ./../"
            exit 1
          fi
          echo "PASS"
