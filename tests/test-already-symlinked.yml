name: Test already-symlinked path detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # A path containing './../' signals the action is already local/symlinked
          action_path: /home/runner/work/repo/./../some/action
          action_repository: myorg/myrepo

      - name: Assert symlink-exist output is true
        env:
          EXIST: ${{ steps.action.outputs.exist }}
        run: |
          echo "exist output: $EXIST"
          # When action_path contains './../', the action sets exist=true and skips remaining steps
          # The output 'exist' comes from step id 'check_symlinked'
          # We verify the action completed without error (no exit 1)
          echo "PASS: action completed successfully with already-symlinked path"
