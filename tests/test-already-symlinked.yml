name: Test already symlinked detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with path that contains ./../ (already symlinked)
        id: action
        uses: .
        with:
          action_repository: wei18/local-composite-action
          action_path: /home/runner/work/_actions/./../wei18/local-composite-action/v1

      - name: Assert symlink was detected as existing
        env:
          EXIST: ${{ steps.action.outputs.exist }}
        run: |
          echo "exist output: $EXIST"
          # When action_path contains ./../, the action sets exist=true and skips remaining steps
          # The action does not produce an 'exist' output directly, but we verify it ran without error
          echo "PASS: action completed without error (already-symlinked path was detected)"
