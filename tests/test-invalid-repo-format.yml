name: Test invalid repository format causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up directory structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_action/wei18/my-action/v1.0.0"

      - id: action
        uses: .
        with:
          composite_action_path: ${{ github.workspace }}/_action/wei18/my-action/v1.0.0
          composite_action_repository: invalid-no-slash
        continue-on-error: true

      - name: Assert action failed due to invalid repo format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid repo format but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid repository format"
