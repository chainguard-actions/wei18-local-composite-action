name: Test multiple subdirs in repo dir fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture directories with multiple subdirs
        run: |
          # Create two subdirectories inside the repo dir — action expects exactly one
          mkdir -p /tmp/runner/myorg/myrepo/v1
          mkdir -p /tmp/runner/myorg/myrepo/v2

      # The action should fail because there are two subdirs (v1 and v2)
      - id: action
        uses: .
        continue-on-error: true
        with:
          composite_action_path: /tmp/runner/myorg/myrepo/v1
          composite_action_repository: myorg/myrepo

      - name: Assert action failed with multiple subdirs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when repo dir has multiple subdirs, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS"
