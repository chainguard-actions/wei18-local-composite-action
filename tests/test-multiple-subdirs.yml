name: Test failure when repo directory has multiple subdirectories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up directory structure with multiple subdirs
        run: |
          # Create two subdirs inside the repo dir — action expects exactly one
          mkdir -p "$GITHUB_WORKSPACE/_action/wei18/multi-action/v1.0.0/composite-actions/action1"
          mkdir -p "$GITHUB_WORKSPACE/_action/wei18/multi-action/v2.0.0/composite-actions/action1"

      - id: action
        uses: .
        with:
          composite_action_path: ${{ github.workspace }}/_action/wei18/multi-action/v1.0.0/composite-actions/action1
          composite_action_repository: wei18/multi-action
        continue-on-error: true

      - name: Assert action failed due to multiple subdirectories
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with multiple subdirs but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when repo directory has multiple subdirectories"
