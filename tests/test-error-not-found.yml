name: Test error when action repository not found in path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup a path that does NOT match the action_repository
        run: |
          # Create a directory structure that does NOT contain 'someorg/somerepo'
          mkdir -p /tmp/fake-runner/differentorg/differentrepo/abc123
          echo "Created fake runner directory (mismatched org/repo)"

      - id: action
        uses: .
        continue-on-error: true
        with:
          # action_path does not contain 'someorg/somerepo' in its hierarchy
          action_path: /tmp/fake-runner/differentorg/differentrepo/abc123
          action_repository: someorg/somerepo

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when repository not found in path, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when repository not found"
