name: Test invalid repository format fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture directories
        run: |
          mkdir -p /tmp/runner/myorg/myrepo/v1

      # An invalid repository (no slash) should cause the action to fail
      # because parse_repo will set ORG="" or REPO="" and log_error will be called
      - id: action
        uses: .
        continue-on-error: true
        with:
          composite_action_path: /tmp/runner/myorg/myrepo/v1
          composite_action_repository: invalidrepo

      - name: Assert action failed on invalid repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid repository format, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS"
