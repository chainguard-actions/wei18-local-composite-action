name: Test failure when repo directory not found in path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up directory structure with mismatched repo name
        run: |
          # The action path does NOT contain the org/repo pattern in its hierarchy
          # because the directory is named "different-repo" but we claim "nonexistent-repo"
          mkdir -p "$GITHUB_WORKSPACE/_action/someorg/different-repo/v1.0.0"

      - id: action
        uses: .
        with:
          composite_action_path: ${{ github.workspace }}/_action/someorg/different-repo/v1.0.0
          composite_action_repository: someorg/nonexistent-repo
        continue-on-error: true

      - name: Assert action failed because repo dir was not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when repo dir not found but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when repo directory not found in path"
