name: Test repo dir not found fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture directories
        run: |
          # The composite_action_path does NOT contain org/repo in its hierarchy
          mkdir -p /tmp/runner/someotherpath/v1

      # The action should fail because it can't find myorg/myrepo in the path hierarchy
      - id: action
        uses: .
        continue-on-error: true
        with:
          composite_action_path: /tmp/runner/someotherpath/v1
          composite_action_repository: myorg/myrepo

      - name: Assert action failed when repo dir not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when repo dir not found, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS"
